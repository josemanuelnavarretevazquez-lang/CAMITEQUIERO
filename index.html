<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#02000a">
<title>♡</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Great+Vibes&family=Dancing+Script:wght@500;700;900&display=swap" rel="stylesheet">

<style>
*,*::before,*::after{ box-sizing:border-box; margin:0; padding:0; }

html,body{
  height:100%;
  overflow:hidden;
  background:#02000a;
  font-family:'Cormorant Garamond', Georgia, serif;
  -webkit-font-smoothing:antialiased;
  color:#fff;
  user-select:none;
  -webkit-user-select:none;
  touch-action:none;
}

body::before{
  content:'';
  position:fixed;
  inset:0;
  z-index:0;
  pointer-events:none;
  background:
    radial-gradient(ellipse 80% 55% at 18% 22%, rgba(120, 40, 200, 0.24), transparent 60%),
    radial-gradient(ellipse 65% 50% at 82% 30%, rgba(40, 100, 220, 0.22), transparent 60%),
    radial-gradient(ellipse 70% 55% at 75% 80%, rgba(255, 60, 140, 0.16), transparent 65%),
    radial-gradient(ellipse 60% 45% at 15% 75%, rgba(60, 200, 200, 0.16), transparent 60%),
    radial-gradient(ellipse 100% 70% at 50% 50%, rgba(90, 30, 150, 0.20), transparent 75%),
    radial-gradient(ellipse 40% 30% at 55% 45%, rgba(255, 200, 100, 0.10), transparent 60%),
    linear-gradient(160deg, #02000a 0%, #08031a 45%, #03000d 100%);
  animation: nebulaShift 30s ease-in-out infinite alternate;
}

@keyframes nebulaShift{
  0%   { filter: hue-rotate(0deg)   brightness(1);    }
  50%  { filter: hue-rotate(-15deg) brightness(1.18); }
  100% { filter: hue-rotate(20deg)  brightness(1.05); }
}

#particles{
  position:fixed;
  inset:0;
  z-index:0;
  pointer-events:none;
  overflow:hidden;
}
#particles .pt{
  position:absolute;
  border-radius:50%;
  animation: floatUp linear infinite;
  opacity:0;
}
@keyframes floatUp{
  0%   { transform:translateY(0) scale(0.5); opacity:0; }
  15%  { opacity:0.85; }
  85%  { opacity:0.6; }
  100% { transform:translateY(-110vh) scale(1.3); opacity:0; }
}

/* ============================================================
   CORAZÓN HTML/CSS CON LATIDO (reemplaza el canvas)
   ============================================================ */
#heartFinal{
  position:fixed;
  inset:0;
  z-index:2;
  display:none;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:clamp(36px, 6.5vh, 64px);
  padding:4vh 5vw;
  text-align:center;
  opacity:0;
  transition:opacity 1.2s ease;
}
#heartFinal.on{ display:flex; opacity:1; }

/* Halo luminoso pulsante detrás del corazón */
.halo{
  position:absolute;
  top:50%;
  left:50%;
  width:clamp(320px, 60vw, 560px);
  height:clamp(320px, 60vw, 560px);
  transform:translate(-50%, -58%);
  border-radius:50%;
  background:radial-gradient(circle,
    rgba(255, 80, 160, 0.35) 0%,
    rgba(180, 80, 255, 0.22) 30%,
    rgba(80, 100, 255, 0.12) 55%,
    transparent 72%);
  filter:blur(30px);
  pointer-events:none;
  animation:haloPulse 2.2s ease-in-out infinite;
}

@keyframes haloPulse{
  0%,100% { transform:translate(-50%, -58%) scale(1);    opacity:0.8; }
  50%     { transform:translate(-50%, -58%) scale(1.12); opacity:1;   }
}

/* Corazón CSS con latido */
.corazon{
  position:relative;
  animation: latido 1.15s cubic-bezier(.45,.05,.55,.95) infinite;
  background:linear-gradient(135deg, #ff4d7a 0%, #ff2b6b 45%, #d61a8a 100%);
  display:inline-block;
  height:clamp(70px, 13vw, 100px);
  width:clamp(70px, 13vw, 100px);
  transform:rotate(-45deg);
  filter:drop-shadow(0 0 28px rgba(255, 60, 120, 0.85))
         drop-shadow(0 0 60px rgba(180, 80, 255, 0.55))
         drop-shadow(0 0 100px rgba(120, 100, 255, 0.35));
  cursor:pointer;
  transition:filter 0.4s ease;
  will-change:transform;
}

.corazon:hover{
  filter:drop-shadow(0 0 40px rgba(255, 90, 160, 1))
         drop-shadow(0 0 80px rgba(200, 100, 255, 0.8))
         drop-shadow(0 0 130px rgba(140, 120, 255, 0.55));
}

.corazon:before,
.corazon:after{
  content:"";
  background:inherit;
  border-radius:50%;
  height:100%;
  width:100%;
  position:absolute;
}

.corazon:before{
  top:-50%;
  left:0;
}

.corazon:after{
  left:50%;
  top:0;
}

.corazon .shine{
  position:absolute;
  inset:0;
  border-radius:50%;
  background:radial-gradient(circle at 32% 30%, rgba(255,255,255,0.75), transparent 55%);
  pointer-events:none;
  z-index:2;
}
.corazon .shine2{
  position:absolute;
  top:-50%;
  left:0;
  width:100%;
  height:100%;
  border-radius:50%;
  background:radial-gradient(circle at 35% 30%, rgba(255,255,255,0.55), transparent 55%);
  pointer-events:none;
  z-index:2;
}

@keyframes latido{
  0%   { transform: scale(1)    rotate(-45deg); }
  12%  { transform: scale(1.18) rotate(-45deg); }
  24%  { transform: scale(1.32) rotate(-45deg); }
  36%  { transform: scale(1.06) rotate(-45deg); }
  48%  { transform: scale(1.14) rotate(-45deg); }
  62%  { transform: scale(1)    rotate(-45deg); }
  100% { transform: scale(1)    rotate(-45deg); }
}

/* Textos */
.heart-texts{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:clamp(14px, 2.4vh, 22px);
  position:relative;
  z-index:2;
}

.frase{
  font-family:'Great Vibes', cursive;
  font-size:clamp(2.3rem, 7.2vw, 4.4rem);
  line-height:1.1;
  background:linear-gradient(135deg, #ffe0ef, #ff9dd6, #c0b0ff, #9dd8ff, #ffd6e8);
  background-size:300% 300%;
  -webkit-background-clip:text;
  background-clip:text;
  -webkit-text-fill-color:transparent;
  filter:drop-shadow(0 0 28px rgba(255, 140, 200, 0.6))
         drop-shadow(0 0 50px rgba(160, 120, 255, 0.4));
  animation: textFlow 7s ease infinite;
  padding:0 1rem;
  letter-spacing:0.02em;
}

@keyframes textFlow{
  0%,100% { background-position:0% 50%; }
  50%     { background-position:100% 50%; }
}

.frase2{
  font-family:'Dancing Script', cursive;
  font-size:clamp(1.4rem, 4.2vw, 2.3rem);
  font-weight:700;
  letter-spacing:0.03em;
  background:linear-gradient(135deg, #b0c8ff, #d0b0ff, #ffb0e0, #b0c8ff);
  background-size:250% 250%;
  -webkit-background-clip:text;
  background-clip:text;
  -webkit-text-fill-color:transparent;
  filter:drop-shadow(0 0 22px rgba(180, 160, 255, 0.6));
  animation: textFlow 6s ease infinite reverse;
}

.divider{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:14px;
  margin:clamp(4px, 1vh, 10px) 0;
  opacity:0.9;
}
.divider span{
  display:block;
  height:1px;
  width:clamp(40px, 12vw, 100px);
  background:linear-gradient(90deg, transparent, rgba(200, 160, 255, 0.85), transparent);
}
.divider i{
  font-style:normal;
  color:#ffb8e0;
  font-size:clamp(1rem, 2vw, 1.4rem);
  text-shadow:0 0 18px rgba(255, 140, 200, 0.9);
  animation:dividerPulse 2s ease-in-out infinite;
}
@keyframes dividerPulse{
  0%,100% { transform:scale(1);    opacity:0.85; }
  50%     { transform:scale(1.28); opacity:1;   }
}

.teQuiero{
  font-family:'Great Vibes', cursive;
  font-size:clamp(2.8rem, 9vw, 5.4rem);
  line-height:1;
  background:linear-gradient(135deg, #ffd6e8, #ff7bc8, #ff3d9a, #ff7bc8, #ffd6e8);
  background-size:300% 300%;
  -webkit-background-clip:text;
  background-clip:text;
  -webkit-text-fill-color:transparent;
  filter:drop-shadow(0 0 30px rgba(255, 90, 170, 0.75))
         drop-shadow(0 0 60px rgba(255, 120, 220, 0.5));
  animation: textFlow 5s ease infinite, teQuieroPulse 2.2s ease-in-out infinite;
  letter-spacing:0.04em;
  margin-top:clamp(4px, 1vh, 10px);
}

@keyframes teQuieroPulse{
  0%,100% { transform:scale(1);    }
  50%     { transform:scale(1.05); }
}

/* Corazoncitos flotantes del fondo */
.floaters{
  position:fixed;
  inset:0;
  z-index:1;
  pointer-events:none;
  overflow:hidden;
}
.floaters .fh{
  position:absolute;
  animation: floatUpHeart linear infinite;
  opacity:0;
  will-change:transform, opacity;
  text-shadow:0 0 14px rgba(255, 100, 180, 0.8);
}

@keyframes floatUpHeart{
  0%   { transform:translateY(0) scale(0.6) rotate(0deg); opacity:0; }
  15%  { opacity:0.9; }
  85%  { opacity:0.5; }
  100% { transform:translateY(-115vh) scale(1.2) rotate(28deg); opacity:0; }
}

/* Destellos aleatorios */
.sparkle{
  position:fixed;
  pointer-events:none;
  z-index:2;
  color:#fff;
  font-size:14px;
  text-shadow:0 0 12px rgba(255,255,255,0.9), 0 0 24px rgba(200,160,255,0.8);
  animation:sparkleFade 1.8s ease-out forwards;
}
@keyframes sparkleFade{
  0%   { opacity:0; transform:scale(0.3) rotate(0deg); }
  20%  { opacity:1; transform:scale(1.2) rotate(30deg); }
  100% { opacity:0; transform:scale(0.6) rotate(90deg); }
}

/* ============================================================
   RESTO DE UI (welcome, carrito, controles, poemas…)
   ============================================================ */
#stage{
  position:fixed;
  inset:0;
  z-index:1;
  display:block;
  width:100%;
  height:100%;
  cursor:default;
  touch-action:none;
  -webkit-tap-highlight-color:transparent;
  opacity:0;
  transition:opacity 1.4s ease;
  pointer-events:none;
}
#stage.on{ opacity:1; }

#welcome{
  position:fixed;
  inset:0;
  z-index:5;
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  align-items:center;
  padding:0 6vw 4vh;
  text-align:center;
  background:radial-gradient(ellipse at center, rgba(20, 5, 45, 0.7) 0%, rgba(2, 0, 10, 0.97) 70%);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  transition:opacity 1.2s ease, visibility 1.2s;
}
#welcome.hidden{ opacity:0; visibility:hidden; pointer-events:none; }

#carZone{
  position:absolute;
  bottom:4vh;
  left:50%;
  transform:translateX(-50%);
  width:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  pointer-events:none;
  z-index:10;
}

#car{
  position:relative;
  width:220px;
  height:120px;
  animation: carDrive 3.6s ease-in-out infinite;
  cursor:pointer;
  transition:transform 0.4s ease;
  filter:drop-shadow(0 10px 35px rgba(180, 80, 255, 0.55));
  pointer-events:auto;
}
#car:hover{
  filter:drop-shadow(0 10px 45px rgba(120, 180, 255, 0.85));
}

@keyframes carDrive{
  0%,100% { transform:translateY(0) rotate(-1.5deg); }
  50%     { transform:translateY(-6px) rotate(1.5deg); }
}

#car.runaway{
  animation: carRunAway 1.8s ease-in forwards;
  pointer-events:none;
}

@keyframes carRunAway{
  0%   { transform:translateX(0) rotate(0deg); }
  20%  { transform:translateX(-30px) rotate(-8deg); }
  40%  { transform:translateX(60px) rotate(8deg); }
  100% { transform:translateX(180vw) rotate(-4deg); }
}

#car svg{ width:100%; height:100%; overflow:visible; }

#car .wheel{
  transform-origin:center;
  animation: wheelSpin 1s linear infinite;
}
#car.runaway .wheel{ animation-duration:0.28s; }

@keyframes wheelSpin{
  from { transform:rotate(0deg); }
  to   { transform:rotate(360deg); }
}

#car .smoke{
  opacity:0.6;
  animation: smokePuff 2.2s ease-out infinite;
}
#car .smoke:nth-child(2){ animation-delay:0.55s; }
#car .smoke:nth-child(3){ animation-delay:1.1s; }

@keyframes smokePuff{
  0%   { transform:translate(0,0) scale(0.4); opacity:0.7; }
  100% { transform:translate(-30px,-18px) scale(1.5); opacity:0; }
}

#carBubble{
  position:absolute;
  bottom:calc(100% + 20px);
  left:50%;
  transform:translateX(-50%) scale(0);
  background:linear-gradient(135deg, rgba(245, 245, 255, 0.98), rgba(230, 230, 255, 0.98));
  color:#3a1050;
  padding:16px 26px;
  border-radius:24px 24px 24px 6px;
  font-family:'Dancing Script', cursive;
  font-size:1.45rem;
  font-weight:700;
  white-space:nowrap;
  box-shadow:0 8px 35px rgba(140, 80, 255, 0.55);
  transform-origin:bottom left;
  transition:transform 0.4s cubic-bezier(.34,1.56,.64,1), opacity 0.3s;
  opacity:0;
  pointer-events:none;
  max-width:85vw;
  z-index:12;
  min-width:180px;
}
#carBubble.show{
  transform:translateX(-50%) scale(1);
  opacity:1;
}
#carBubble::after{
  content:'';
  position:absolute;
  bottom:-10px;
  left:24px;
  width:0;
  height:0;
  border:10px solid transparent;
  border-top-color:rgba(230, 230, 255, 0.98);
  border-bottom:0;
  border-left:0;
}

#carRace{
  position:absolute;
  bottom:calc(100% + 20px);
  left:50%;
  transform:translateX(-50%) scale(0);
  background:linear-gradient(135deg, #7b5bff, #c05bff, #ff5baf, #5bc8ff);
  background-size:300% 300%;
  color:#fff;
  padding:20px 34px;
  border-radius:24px;
  font-family:'Dancing Script', cursive;
  font-size:1.8rem;
  font-weight:900;
  white-space:nowrap;
  text-shadow:0 2px 12px rgba(0,0,0,0.5);
  box-shadow:
    0 10px 40px rgba(140, 80, 255, 0.8),
    0 0 60px rgba(80, 160, 255, 0.6);
  transition:transform 0.4s cubic-bezier(.34,1.56,.64,1), opacity 0.3s;
  opacity:0;
  pointer-events:none;
  max-width:90vw;
  z-index:13;
  animation: raceGradient 1.5s ease infinite, racePulse 0.8s ease-in-out infinite;
  text-align:center;
}

@keyframes raceGradient{
  0%,100% { background-position:0% 50%; }
  50%     { background-position:100% 50%; }
}

@keyframes racePulse{
  0%,100% { box-shadow: 0 10px 40px rgba(140, 80, 255, 0.8), 0 0 60px rgba(80, 160, 255, 0.6); }
  50%     { box-shadow: 0 10px 60px rgba(200, 100, 255, 1), 0 0 90px rgba(120, 200, 255, 0.9); }
}

#carRace.show{
  transform:translateX(-50%) scale(1);
  opacity:1;
}

#carRace .race-sub{
  display:block;
  margin-top:10px;
  font-size:1.4rem;
  font-weight:700;
  opacity:0.95;
  letter-spacing:0.02em;
}

@media (max-width: 600px){
  #carRace{
    font-size:1.4rem;
    padding:16px 22px;
    white-space:normal;
    max-width:90vw;
    line-height:1.3;
  }
  #carRace .race-sub{
    font-size:1.15rem;
    margin-top:8px;
  }
}

#carChoices{
  position:absolute;
  bottom:calc(100% + 100px);
  left:50%;
  transform:translateX(-50%) scale(0);
  display:flex;
  gap:16px;
  transition:transform 0.4s cubic-bezier(.34,1.56,.64,1);
  opacity:0;
  pointer-events:none;
  z-index:11;
}
#carChoices.show{
  transform:translateX(-50%) scale(1);
  opacity:1;
  pointer-events:auto;
}

#carChoices button{
  padding:14px 32px;
  font-family:'Dancing Script', cursive;
  font-size:1.4rem;
  font-weight:700;
  border-radius:44px;
  border:2px solid rgba(160, 140, 255, 0.9);
  cursor:pointer;
  transition:all 0.3s ease;
  background:rgba(245, 245, 255, 0.97);
  color:#3a1050;
  box-shadow:0 6px 24px rgba(140, 80, 255, 0.5);
}
#carChoices button:hover{
  transform:translateY(-4px) scale(1.1);
  box-shadow:0 10px 36px rgba(140, 80, 255, 0.85);
}

#carChoices #btnYes{
  background:linear-gradient(135deg, #c0b0ff, #ff9dd6, #9dd8ff);
  background-size:200% 200%;
  color:#1a0a2e;
  animation: gradientShift 3s ease infinite;
}

@keyframes gradientShift{
  0%,100% { background-position:0% 50%; }
  50%     { background-position:100% 50%; }
}

#carChoices #btnNo{
  background:rgba(220, 220, 240, 0.95);
  color:#4a3060;
}

#startBtn{
  position:absolute;
  bottom:calc(50% - 40px);
  left:50%;
  transform:translate(-50%, 0) scale(0.5);
  padding:1.4rem 3.6rem;
  font-family:'Dancing Script', cursive;
  font-size:clamp(1.6rem, 4vw, 2.2rem);
  font-weight:900;
  letter-spacing:0.06em;
  color:#fff;
  background:linear-gradient(135deg, #5b8fff, #a05bff, #ff5bd6, #5bc8ff, #5b8fff);
  background-size:300% 300%;
  border:none;
  border-radius:70px;
  cursor:pointer;
  box-shadow:
    0 0 40px rgba(120, 80, 255, 0.7),
    0 10px 40px rgba(80, 140, 255, 0.5),
    inset 0 0 30px rgba(255, 255, 255, 0.25);
  transition:all 0.5s ease;
  opacity:0;
  pointer-events:none;
  animation: rainbowFlow 5s ease infinite;
  z-index:15;
}

@keyframes rainbowFlow{
  0%,100% { background-position:0% 50%; }
  50%     { background-position:100% 50%; }
}

#startBtn.show{
  opacity:1;
  transform:translate(-50%, 0) scale(1);
  pointer-events:auto;
}

#startBtn:hover{
  transform:translate(-50%, -4px) scale(1.08);
  box-shadow:
    0 0 60px rgba(160, 80, 255, 1),
    0 15px 50px rgba(80, 140, 255, 0.8),
    inset 0 0 40px rgba(255, 255, 255, 0.4);
}

#startBtn:active{ transform:translate(-50%, 0) scale(0.98); }

#controls{
  position:fixed;
  top:20px;
  right:20px;
  z-index:6;
  display:flex;
  gap:12px;
  opacity:0;
  pointer-events:none;
  transition:opacity 0.6s ease;
}
#controls.visible{ opacity:1; pointer-events:auto; }

#controls button{
  width:52px;
  height:52px;
  border-radius:50%;
  background:rgba(20, 10, 50, 0.7);
  border:1.5px solid rgba(160, 140, 255, 0.7);
  color:#c8d0ff;
  cursor:pointer;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:1.4rem;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  box-shadow:0 0 20px rgba(120, 80, 255, 0.45);
  transition:all 0.3s ease;
}
#controls button:hover{
  transform:scale(1.12);
  box-shadow:0 0 38px rgba(120, 140, 255, 0.9);
  background:rgba(100, 60, 200, 0.35);
}

#musicBtn.playing{ animation: musicPulse 1.6s ease-in-out infinite; }
@keyframes musicPulse{
  0%,100% { box-shadow:0 0 20px rgba(120, 80, 255, 0.45); }
  50%     { box-shadow:0 0 45px rgba(100, 160, 255, 1); }
}

#hint{
  position:fixed;
  left:50%;
  bottom:clamp(22px, 5vh, 48px);
  transform:translateX(-50%);
  z-index:3;
  font-family:'Dancing Script', cursive;
  font-size:clamp(1rem, 2.6vw, 1.25rem);
  color:rgba(200, 210, 255, 0.75);
  letter-spacing:0.04em;
  pointer-events:none;
  opacity:0;
  transition:opacity 1.2s ease;
  text-align:center;
  white-space:nowrap;
  text-shadow:0 0 25px rgba(120, 140, 255, 0.6);
}
#hint.on{ opacity:1; }
#hint.fade{ opacity:0; }

#progress{
  position:fixed;
  left:50%;
  bottom:clamp(60px, 9vh, 90px);
  transform:translateX(-50%);
  z-index:3;
  display:flex;
  gap:10px;
  opacity:0;
  transition:opacity 0.8s ease;
}
#progress.on{ opacity:1; }

#progress .dot{
  width:10px;
  height:10px;
  border-radius:50%;
  background:rgba(140, 120, 220, 0.3);
  transition:all 0.4s ease;
}
#progress .dot.active{
  background:linear-gradient(135deg, #7b5bff, #c05bff, #5bc8ff);
  box-shadow:0 0 16px #a0c8ff;
  transform:scale(1.6);
}
#progress .dot.done{
  background:rgba(160, 140, 255, 0.7);
}

#arrowL, #arrowR{
  position:fixed;
  top:50%;
  transform:translateY(-50%);
  z-index:3;
  width:58px;
  height:58px;
  border-radius:50%;
  background:rgba(20, 10, 50, 0.5);
  border:1.5px solid rgba(160, 140, 255, 0.5);
  color:rgba(200, 210, 255, 0.85);
  cursor:pointer;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:1.6rem;
  backdrop-filter: blur(8px);
  opacity:0;
  pointer-events:none;
  transition:all 0.35s ease;
}
#arrowL{ left:3vw; }
#arrowR{ right:3vw; }

#arrowL.visible, #arrowR.visible{ opacity:1; pointer-events:auto; }

}

@media (max-width: 480px){

}
</style>
</head>

<body>

<script>
(function(){
'use strict';

const POEM_RAW = [
  { title: 'De la grata fortuna de tu existencia', lines: [] },
  { lines: [
    'Hay presencias que, sin proclamar su llegada,',
    'alteran la quietud de cuanto las circunda;',
    'como el alba que, en silencio, disipa la noche',
    'y devuelve a los campos su antigua hermosura.'
  ]},
  { lines: [
    'Ignoro qué designio, qué ignota providencia',
    'dispuso que tu senda coincidiera con la mía;',
    'mas sé que, desde entonces, hay una luz distinta',
    'en ciertos pensamientos que antes no florecían.'
  ]},
  { lines: [
    'No es menester que el tiempo consagre los encuentros,',
    'ni que los nombres definan aquello que acontece;',
    'hay almas cuya esencia, aun sin ser comprendida,',
    'deja una huella indeleble allí donde aparece.'
  ]},
  { lines: [
    'Me importa la ventura que habita en tus mañanas,',
    'la paz que te acompañe al declinar el día;',
    'que no mancille el mundo la nobleza de tus sueños,',
    'ni extinga sus pesares tu natural alegría.'
  ]},
  { lines: [
    'Quisiera que la fortuna te fuese complaciente,',
    'que el infortunio olvidase el umbral de tu morada;',
    'que hallases en la vida motivos suficientes',
    'para jamás sentir tu existencia desdichada.'
  ]},
  { lines: [
    'Y si alguna vez la adversidad ensombrece tu horizonte,',
    'si el desaliento ciñe de penumbra tu mirada,',
    'ojalá encuentres, aun entre las ruinas del instante,',
    'la certeza de que eres digna de las cosas más sagradas.'
  ]},
  { lines: [
    'No pretendo imponerle a tu destino mis anhelos,',
    'ni reclamar del tiempo promesas venideras;',
    'pues hay sentimientos que conservan su nobleza',
    'cuando se ofrecen libres, sin exigir siquiera.'
  ]},
  { lines: [
    'Por eso, si estas líneas algún día te alcanzaren,',
    'no busques entre ellas juramentos ni cadenas;',
    'tan solo encontrarás la humilde certidumbre',
    'de que tu existencia me resulta extraordinariamente bella.'
  ]},
  { lines: [
    'Y acaso sea esta la más sincera de mis dichas:',
    'no saber qué deparará el porvenir incierto,',
    'pero agradecer, entre tantas casualidades del mundo,',
    'la grata fortuna de haberte conocido.'
  ]}
];

const canvas    = document.getElementById('stage');
const ctx       = canvas.getContext('2d', { alpha: true });
const hint      = document.getElementById('hint');
const welcome   = document.getElementById('welcome');
const startBtn  = document.getElementById('startBtn');
const musicBtn  = document.getElementById('musicBtn');
const restartBtn= document.getElementById('restartBtn');
const controls  = document.getElementById('controls');
const bgMusic   = document.getElementById('bgMusic');
const progress  = document.getElementById('progress');
const arrowL    = document.getElementById('arrowL');
const arrowR    = document.getElementById('arrowR');
const car       = document.getElementById('car');
const carBubble = document.getElementById('carBubble');
const carRace   = document.getElementById('carRace');
const carChoices= document.getElementById('carChoices');
const btnYes    = document.getElementById('btnYes');
const btnNo     = document.getElementById('btnNo');
const particlesEl = document.getElementById('particles');
const heartFinal  = document.getElementById('heartFinal');
const corazonHTML = document.getElementById('corazonHTML');
const floatersEl  = document.getElementById('floaters');

let W = 0, H = 0, DPR = 1, CX = 0, CY = 0;

const state = {
  phase: 'welcome',
  heartStartTime: 0
};

const stanzaState = {
  current: 0,
  stanzaEl: null,
  typeTimers: [],
  transitioning: false,
  LINE_DELAY: 320
};

/* ============================================================
   ESTRELLAS DE FONDO
   ============================================================ */
let stars = [];
function buildStars(){
  stars = [];
  const n = Math.min(200, Math.floor((W * H) / 8000));
  for (let i = 0; i < n; i++){
    const r = Math.random();
    stars.push({
      x: Math.random() * W,
      y: Math.random() * H,
      r: r < 0.88 ? Math.random() * 0.8 + 0.2 : Math.random() * 1.4 + 0.5,
      ph: Math.random() * Math.PI * 2,
      sp: 0.4 + Math.random() * 2.2,
      hue: r < 0.55 ? 'w' : (r < 0.72 ? 'v' : (r < 0.86 ? 'b' : (r < 0.94 ? 'p' : 'g')))
    });
  }
}

function buildParticles(){
  const colors = ['#7b5bff', '#a05bff', '#5b8fff', '#5bc8ff', '#c05bff', '#ff5baf', '#8affd0'];
  for (let i = 0; i < 20; i++){
    const p = document.createElement('div');
    p.className = 'pt';
    const size = Math.random() * 3.5 + 1.2;
    p.style.width = size + 'px';
    p.style.height = size + 'px';
    p.style.left = Math.random() * 100 + '%';
    p.style.bottom = '-20px';
    const c = colors[Math.floor(Math.random() * colors.length)];
    p.style.background = c;
    p.style.boxShadow = `0 0 ${size*2}px ${c}`;
    p.style.animationDuration = (16 + Math.random() * 22) + 's';
    p.style.animationDelay = (Math.random() * -30) + 's';
    particlesEl.appendChild(p);
  }
}

/* ============================================================
   CORAZONCITOS FLOTANTES Y DESTELLOS
   ============================================================ */
const symbols = ['♡', '♥', '❤', '💗', '💕', '🤍', '💜', '💖'];

function buildFloaters(){
  floatersEl.innerHTML = '';
  for (let i = 0; i < 26; i++){
    const h = document.createElement('div');
    h.className = 'fh';
    h.textContent = symbols[Math.floor(Math.random() * symbols.length)];
    h.style.left = Math.random() * 100 + '%';
    h.style.bottom = '-50px';
    h.style.fontSize = (13 + Math.random() * 22) + 'px';
    h.style.animationDuration = (10 + Math.random() * 18) + 's';
    h.style.animationDelay = (Math.random() * -25) + 's';
    h.style.color = `rgba(255, ${100 + Math.random()*100}, ${160 + Math.random()*90}, 0.55)`;
    floatersEl.appendChild(h);
  }
}

let sparklesRunning = false;
function crearDestello(){
  const s = document.createElement('div');
  s.className = 'sparkle';
  s.textContent = Math.random() > 0.5 ? '✦' : '✧';
  s.style.left = Math.random() * 100 + 'vw';
  s.style.top = Math.random() * 100 + 'vh';
  s.style.fontSize = (8 + Math.random() * 14) + 'px';
  document.body.appendChild(s);
  setTimeout(() => s.remove(), 1900);
}

function loopSparkles(){
  if (!sparklesRunning) return;
  crearDestello();
  setTimeout(loopSparkles, 400 + Math.random() * 900);
}

/* ============================================================
   INTERACCIÓN DEL CORAZÓN (clic → latido extra + explosión)
   ============================================================ */
function latidoExtra(){
  corazonHTML.style.animation = 'none';
  void corazonHTML.offsetWidth;
  corazonHTML.style.animation = 'latido 0.55s cubic-bezier(.45,.05,.55,.95) 3';
  setTimeout(() => {
    corazonHTML.style.animation = 'latido 1.15s cubic-bezier(.45,.05,.55,.95) infinite';
  }, 1700);
}

function explosionCorazones(cx, cy){
  for (let i = 0; i < 14; i++){
    const p = document.createElement('div');
    p.textContent = symbols[Math.floor(Math.random() * symbols.length)];
    p.style.position = 'fixed';
    p.style.left = cx + 'px';
    p.style.top = cy + 'px';
    p.style.fontSize = (16 + Math.random() * 18) + 'px';
    p.style.color = `rgba(255, ${120 + Math.random()*100}, ${180 + Math.random()*70}, 0.95)`;
    p.style.pointerEvents = 'none';
    p.style.zIndex = '999';
    p.style.transition = 'transform 1.2s cubic-bezier(.2,.8,.4,1), opacity 1.2s ease';
    p.style.textShadow = '0 0 16px rgba(255, 120, 200, 0.95)';
    document.body.appendChild(p);

    const ang = Math.random() * Math.PI * 2;
    const dist = 70 + Math.random() * 150;
    const dx = Math.cos(ang) * dist;
    const dy = Math.sin(ang) * dist;

    requestAnimationFrame(() => {
      p.style.transform = `translate(${dx}px, ${dy}px) scale(1.5) rotate(${(Math.random()-0.5)*80}deg)`;
      p.style.opacity = '0';
    });

    setTimeout(() => p.remove(), 1300);
  }
}

corazonHTML.addEventListener('click', () => {
  latidoExtra();
  const rect = corazonHTML.getBoundingClientRect();
  explosionCorazones(rect.left + rect.width / 2, rect.top + rect.height / 2);
});

/* ============================================================
   RESIZE
   ============================================================ */
function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 1.5);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width  = Math.floor(W * DPR);
  canvas.height = Math.floor(H * DPR);
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  CX = W / 2;
  CY = H / 2;
}

/* ============================================================
   PROGRESO Y FLECHAS
   ============================================================ */
function buildProgress(){
  progress.innerHTML = '';
  POEM_RAW.forEach(() => {
    const d = document.createElement('div');
    d.className = 'dot';
    progress.appendChild(d);
  });
}

function updateProgress(){
  const dots = progress.querySelectorAll('.dot');
  dots.forEach((d, i) => {
    d.classList.remove('active', 'done');
    if (i < stanzaState.current) d.classList.add('done');
    if (i === stanzaState.current) d.classList.add('active');
  });
}

function updateArrows(){
  arrowL.classList.toggle('visible', stanzaState.current > 0);
  arrowR.classList.toggle('visible', stanzaState.current < POEM_RAW.length - 1);
}

/* ============================================================
   ESTROFA
   ============================================================ */
function clearStanza(){
  stanzaState.typeTimers.forEach(t => clearTimeout(t));
  stanzaState.typeTimers = [];
  if (stanzaState.stanzaEl){
    stanzaState.stanzaEl.remove();
    stanzaState.stanzaEl = null;
  }
}

function typeLine(lineEl, texto, delayStart, speed, timers){
  const chars = [];
  for (let i = 0; i < texto.length; i++){
    const span = document.createElement('span');
    span.className = 'ch';
    span.textContent = texto[i] === ' ' ? '\u00A0' : texto[i];
    lineEl.appendChild(span);
    chars.push(span);
  }
  let i = 0;
  function step(){
    if (i >= chars.length) return;
    chars[i].classList.add('on');
    i++;
    const t = setTimeout(step, speed);
    timers.push(t);
  }
  const t0 = setTimeout(step, delayStart);
  timers.push(t0);
}

function showStanza(index){
  if (index < 0 || index >= POEM_RAW.length) return;
  stanzaState.current = index;
  updateProgress();
  updateArrows();
  clearStanza();

  const stanza = POEM_RAW[index];
  const el = document.createElement('div');
  el.className = 'stanza';
  document.body.appendChild(el);
  stanzaState.stanzaEl = el;
  const timers = stanzaState.typeTimers;

  if (stanza.title){
    const t = document.createElement('div');
    t.className = 'vline';
    t.style.fontFamily = "'Great Vibes', cursive";
    t.style.fontSize = 'clamp(1.7rem, 4.2vw, 3rem)';
    t.style.letterSpacing = '1px';
    el.appendChild(t);
    typeLine(t, stanza.title, 0, 35, timers);
  }
  stanza.lines.forEach((line, i) => {
    const l = document.createElement('div');
    l.className = 'vline';
    el.appendChild(l);
    const delay = (stanza.title ? 400 : 0) + i * stanzaState.LINE_DELAY;
    typeLine(l, line, delay, 30, timers);
  });
}

function slideOutStanza(direction, cb){
  if (!stanzaState.stanzaEl){ if (cb) cb(); return; }
  const el = stanzaState.stanzaEl;
  el.style.transition = 'transform 0.5s ease, opacity 0.5s ease';
  const dx = direction === 'left' ? -W * 0.9 : W * 0.9;
  el.style.transform = `translate(calc(-50% + ${dx}px), -50%)`;
  el.style.opacity = '0';
  setTimeout(() => {
    el.remove();
    if (stanzaState.stanzaEl === el) stanzaState.stanzaEl = null;
    if (cb) cb();
  }, 510);
}

function nextStanza(){
  if (stanzaState.transitioning) return;
  if (stanzaState.current >= POEM_RAW.length - 1){
    finishStanzas();
    return;
  }
  stanzaState.transitioning = true;
  slideOutStanza('left', () => {
    showStanza(stanzaState.current + 1);
    stanzaState.transitioning = false;
  });
}

function prevStanza(){
  if (stanzaState.transitioning) return;
  if (stanzaState.current <= 0) return;
  stanzaState.transitioning = true;
  slideOutStanza('right', () => {
    showStanza(stanzaState.current - 1);
    stanzaState.transitioning = false;
  });
}

/* ============================================================
   FINAL → CORAZÓN HTML/CSS
   ============================================================ */
async function finishStanzas(){
  if (stanzaState.transitioning) return;
  stanzaState.transitioning = true;
  state.phase = 'heart';

  arrowL.classList.remove('visible');
  arrowR.classList.remove('visible');
  progress.classList.remove('on');
  hint.classList.remove('on');

  if (stanzaState.stanzaEl){
    stanzaState.stanzaEl.style.transition = 'opacity 0.8s';
    stanzaState.stanzaEl.style.opacity = '0';
    await sleep(600);
    clearStanza();
  }
  await sleep(300);

  state.phase = 'heart';
  state.heartStartTime = performance.now();
  canvas.classList.add('on');

  /* Mostrar el corazón HTML */
  buildFloaters();
  heartFinal.classList.add('on');
  sparklesRunning = true;
  loopSparkles();

  setTimeout(() => {
    hint.textContent = 'toca el corazón ♡';
    hint.classList.remove('fade');
    hint.classList.add('on');
  }, 1200);
  setTimeout(() => hint.classList.add('fade'), 9000);
}

/* ============================================================
   LOOP PRINCIPAL (solo estrellas de fondo)
   ============================================================ */
function loop(now){
  requestAnimationFrame(loop);
  const t = now / 1000;

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, W, H);

  if (state.phase === 'heart'){
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < stars.length; i++){
      const s = stars[i];
      const tw = 0.28 + 0.72 * Math.abs(Math.sin(t * s.sp + s.ph));
      ctx.globalAlpha = tw * 0.75;
      ctx.fillStyle =
        s.hue === 'w' ? '#ffffff' :
        s.hue === 'v' ? '#a08aff' :
        s.hue === 'b' ? '#8ac8ff' :
        s.hue === 'p' ? '#ff8acc' : '#8affd0';
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }
}

/* ============================================================
   SWIPE GLOBAL
   ============================================================ */
function attachSwipe(){
  let startX = 0, startY = 0, startT = 0;
  let active = false;

  document.addEventListener('pointerdown', e => {
    if (state.phase !== 'stanzas') return;
    if (e.target.closest('button')) return;
    active = true;
    startX = e.clientX;
    startY = e.clientY;
    startT = performance.now();
  });

  document.addEventListener('pointerup', e => {
    if (!active) return;
    active = false;
    if (state.phase !== 'stanzas') return;
    const dx = e.clientX - startX;
    const dy = e.clientY - startY;
    const dt = performance.now() - startT;
    if (Math.abs(dx) < 40 || Math.abs(dy) > Math.abs(dx)) return;
    if (dt > 1200) return;
    if (dx < 0) nextStanza();
    else prevStanza();
  });
}

/* ============================================================
   MÚSICA
   ============================================================ */
let musicPlaying = false;

function setMusicIcon(){
  musicBtn.textContent = musicPlaying ? '⏸' : '♪';
  musicBtn.classList.toggle('playing', musicPlaying);
}

function tryPlayMusic(){
  bgMusic.volume = 0.55;
  const p = bgMusic.play();
  if (p && p.then){
    p.then(() => { musicPlaying = true; setMusicIcon(); })
     .catch(() => { musicPlaying = false; setMusicIcon(); });
  } else {
    musicPlaying = true;
    setMusicIcon();
  }
}

musicBtn.addEventListener('click', () => {
  if (musicPlaying){
    bgMusic.pause();
    musicPlaying = false;
    setMusicIcon();
  } else {
    tryPlayMusic();
  }
});

/* ============================================================
   CARRITO — DIÁLOGO
   ============================================================ */
let carDialogStep = 0;
let bubbleTimer = null;

function showBubble(text, duration){
  clearTimeout(bubbleTimer);
  carBubble.textContent = '';
  carBubble.classList.add('show');

  let i = 0;
  const speed = 55;

  function type(){
    if (i < text.length){
      carBubble.textContent += text[i];
      i++;
      bubbleTimer = setTimeout(type, speed);
    } else if (duration){
      const restante = Math.max(0, duration - text.length * speed);
      bubbleTimer = setTimeout(() => {
        carBubble.classList.remove('show');
      }, restante);
    }
  }
  type();
}

function hideBubble(){
  clearTimeout(bubbleTimer);
  carBubble.classList.remove('show');
}

const CAR_MONOLOGUE = [
  'Oye, Cami... ¿puedo contarte algo? 👀',
  'Manuel pasó días enteros pensando en esto…',
  'Cada palabra, cada color, cada detalle…',
  'Todo lo hizo pensando en ti, de verdad. 💫',
  'Quería regalarte algo que no se pudiera borrar…',
  'Algo que sintieras cada vez que lo leyeras.',
  'Así que preparó este poema, solo para ti. 📖',
  '¿Te animas a leerlo? 💌'
];

function setupCarDialog(){
  setTimeout(() => {
    showBubble('¡Hola, Cami! 👋', 4500);
  }, 600);

  car.addEventListener('click', async function onCarClick(e){
    e.stopPropagation();
    if (carDialogStep !== 0) return;
    carDialogStep = 1;

    hideBubble();
    await sleep(400);

    for (let i = 0; i < CAR_MONOLOGUE.length; i++){
      const frase = CAR_MONOLOGUE[i];
      const duracion = Math.max(3500, frase.length * 95);
      showBubble(frase, duracion);
      await sleep(duracion + 600);
    }

    carChoices.classList.add('show');
  });
}

btnYes.addEventListener('click', async (e) => {
  e.stopPropagation();
  carChoices.classList.remove('show');
  hideBubble();
  await sleep(300);

  carRace.classList.add('show');
  await sleep(6000);

  carRace.classList.remove('show');
  await sleep(400);

  car.classList.add('runaway');
  await sleep(1200);
  startBtn.classList.add('show');
});

btnNo.addEventListener('click', async (e) => {
  e.stopPropagation();
  carChoices.classList.remove('show');
  hideBubble();
  await sleep(200);

  const INSIST = [
    '¿Segura, Cami? 🥺',
    'Te prometo que vale la pena…',
    'Manuel se esforzó muchísimo, en serio…',
    'Solo un poquito, ¿sí? 💕'
  ];
  for (let i = 0; i < INSIST.length; i++){
    const duracion = Math.max(3200, INSIST[i].length * 90);
    showBubble(INSIST[i], duracion);
    await sleep(duracion + 500);
  }

  carChoices.classList.add('show');
});

/* ============================================================
   REINICIO
   ============================================================ */
async function restart(){
  bgMusic.pause();
  bgMusic.currentTime = 0;
  musicPlaying = false;
  setMusicIcon();

  clearStanza();

  state.phase = 'welcome';

  stanzaState.current = 0;
  stanzaState.transitioning = false;

  car.classList.remove('runaway');
  carChoices.classList.remove('show');
  carRace.classList.remove('show');
  hideBubble();
  startBtn.classList.remove('show');
  carDialogStep = 0;

  hint.classList.remove('on', 'fade');
  progress.classList.remove('on');
  arrowL.classList.remove('visible');
  arrowR.classList.remove('visible');
  canvas.classList.remove('on');

  /* Ocultar corazón HTML */
  heartFinal.classList.remove('on');
  sparklesRunning = false;
  floatersEl.innerHTML = '';

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, W, H);

  welcome.classList.remove('hidden');
  controls.classList.remove('visible');
  await sleep(400);

  setTimeout(() => {
    if (state.phase === 'welcome') showBubble('¡Hola, Cami! 👋', 4500);
  }, 700);
}

restartBtn.addEventListener('click', restart);

/* ============================================================
   INICIO
   ============================================================ */
async function startExperience(){
  welcome.classList.add('hidden');
  controls.classList.add('visible');
  await sleep(700);

  state.phase = 'stanzas';
  stanzaState.current = 0;
  stanzaState.transitioning = false;

  buildProgress();
  updateProgress();
  updateArrows();

  progress.classList.add('on');
  hint.textContent = 'desliza ← → o usa las flechas para navegar';
  hint.classList.remove('fade');
  hint.classList.add('on');

  showStanza(0);
}

arrowL.addEventListener('click', prevStanza);
arrowR.addEventListener('click', nextStanza);

document.addEventListener('keydown', e => {
  if (state.phase !== 'stanzas') return;
  if (e.key === 'ArrowRight') nextStanza();
  if (e.key === 'ArrowLeft') prevStanza();
});

function clamp(v, a, b){ return v < a ? a : (v > b ? b : v); }
const sleep = ms => new Promise(r => setTimeout(r, ms));

/* ============================================================
   ARRANQUE
   ============================================================ */
function start(){
  resize();
  buildStars();
  buildParticles();
  attachSwipe();
  setupCarDialog();
  requestAnimationFrame(loop);
}

if (document.fonts && document.fonts.ready){
  document.fonts.ready.then(start).catch(start);
} else {
  window.addEventListener('load', start);
}

let resizeTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(resize, 200);
});

startBtn.addEventListener('click', () => {
  tryPlayMusic();
  startExperience();
});

})();
</script>
